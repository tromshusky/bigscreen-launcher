[package]
name = "bigscreen-launcher-rs"
version = "0.1.0"
edition = "2021"
description = "Rust/GTK4 implementation of BigScreen Launcher"
license = "Unlicense"

[[bin]]
name = "bigscreen-launcher-rs"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.9", package = "gtk4" }
glib = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
